[pytest]
testpaths = tests
# The browser end-to-end tests (tests/e2e) need Chromium and a running server,
# so the default run leaves them out; `pytest -m e2e` runs only them. A later
# -m on the command line replaces this one.
addopts = -m "not e2e"
markers =
    e2e: drives the real app in Chromium (needs Playwright); run with -m e2e
    real_contacts: no automatic contacts between test accounts (see tests/conftest.py)
# Third-party deprecations are not ours to fix, so they stay quiet. Ours are
# errors: this file used to ignore every DeprecationWarning, which is how
# datetime.utcnow() went unnoticed in app code. Later lines win.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    error::DeprecationWarning:app(\..*)?$
