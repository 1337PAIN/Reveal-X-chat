name: Vendored JavaScript advisories

# pip-audit covers the Python dependencies; nothing covered the JavaScript
# vendored under app/static/vendor/, which is how DOMPurify stayed at 3.0.6
# with twenty-three published advisories. This asks OSV about every release
# listed in app/static/vendor/vendor.json.
#
# Weekly as well as on push: an advisory can be published against a release
# that has not changed, and a repository nobody pushes to would never hear.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: OSV check of vendored releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only, so nothing to install.
      - name: Query OSV
        run: python scripts/check_vendored_advisories.py
