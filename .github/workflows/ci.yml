name: CI

# Runs on every push and pull request. The suite existed long before this
# workflow did, which meant every run of it was someone remembering to type
# `pytest` -- and a broken pin in requirements.txt sat unnoticed because a fresh
# install from those exact files was never once exercised. That is the class of
# bug this is here to catch, so both jobs install from the pinned files rather
# than from a cache of whatever happened to work locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what the project is developed on. 3.12 is here so a
        # version-specific break shows up as one red cell rather than as a
        # mystery on somebody else's machine.
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install from the pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Show what actually got installed
        # When a transitive pin drifts, this is the first place to look.
        run: pip list

      - name: Run the suite
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered

  postgres:
    name: Tests on PostgreSQL 16
    runs-on: ubuntu-latest
    # Production runs on PostgreSQL; every other job runs on SQLite. The two
    # differ in ways a passing SQLite suite cannot show -- row objects, type
    # coercion, constraint timing -- so the whole suite runs here against a
    # real server too. tests/conftest.py empties every table between tests,
    # and the SQLite-only tests (WAL settings, upgrades of historical SQLite
    # files) skip themselves when DATABASE_URL is set.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revealx
          POSTGRES_PASSWORD: revealx-ci
          POSTGRES_DB: revealx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revealx -d revealx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://revealx:revealx-ci@localhost:5432/revealx_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install from the pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Run the suite against PostgreSQL
        run: pytest -q

  javascript:
    name: Browser tests
    runs-on: ubuntu-latest
    # The security-critical half of this project runs in the browser: E2EE key
    # agreement, the tamper detector, the service worker's request scoping. It
    # had no automated test at all until these.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        # Needed to regenerate the parity fixture from the server's own detector.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: The feature-parity fixture is current
        # The browser/server parity test compares against recorded server output.
        # If someone changes the Python extractor without regenerating, that test
        # keeps passing against stale numbers -- hiding exactly the drift it is
        # there to catch.
        #
        # Compared numerically rather than byte-for-byte: the correlation
        # features differ in the last bits between numpy builds (1.8e-14
        # Windows vs Ubuntu, summation order) and a byte-exact check fails on
        # every platform except whichever one generated the file.
        run: python scripts/generate_feature_parity_fixture.py --check

      - name: Run the browser tests
        run: node --test "tests/js/*.test.mjs"

  e2e:
    name: Browser end-to-end (Playwright, axe-core)
    runs-on: ubuntu-latest
    # Two real browsers talking through the real server: sign-in, opening a
    # chat by keyboard, E2EE text both ways, the browser-side image split with
    # its integrity check and reconstruction, revoking, a dropped connection
    # and its resume, and the blocking warning when a peer's key changes. Then
    # axe-core over login, chat, settings and /lab at 1440 and 375 px, in both
    # themes, with the AAA contrast rule on. Any violation fails the job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install from the pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Install axe-core from the lockfile
        working-directory: tests/e2e
        run: npm ci --ignore-scripts

      - name: Run the browser tests
        run: pytest -m e2e -q

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/artifacts/
          if-no-files-found: ignore

  container:
    name: Container image builds and serves
    runs-on: ubuntu-latest
    # Docker is not installed on the machine this was written on, so the image
    # could not be built there at all. Here it is built and talked to for real,
    # which is the difference between a Dockerfile that exists and one that is
    # known to work. The build itself catches the runtime library problems --
    # opencv and scikit-learn fail at *import*, so a missing libglib or libgomp
    # produces an image that builds clean and 500s on the first request.
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t reveal-x:ci .

      - name: Start it the way a platform would
        run: |
          docker run -d --name reveal-x-ci \
            -p 5000:5000 \
            -e PORT=5000 \
            -e REVEAL_X_SECRET_KEY=ci-smoke-test-key \
            reveal-x:ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/api/auth/config 2>/dev/null; then
              echo "up after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "container never answered; logs follow"
          docker logs reveal-x-ci
          exit 1

      - name: Serves the application shell
        run: |
          curl -fsS http://127.0.0.1:5000/ | grep -q "Reveal-X" \
            || { echo "page did not contain the app"; docker logs reveal-x-ci; exit 1; }
          echo "OK: application shell served"

      - name: Completes a Socket.IO handshake
        run: |
          curl -fsS "http://127.0.0.1:5000/socket.io/?EIO=4&transport=polling" | grep -q '"sid"' \
            || { echo "no session id in handshake"; docker logs reveal-x-ci; exit 1; }
          echo "OK: Socket.IO handshake completed"

      - name: The ML stack imports inside the container
        # The reason libglib and libgomp are in the Dockerfile. This asserts the
        # detector actually loads rather than trusting that it would.
        run: |
          docker exec reveal-x-ci python -c "
          import cv2, numpy, sklearn
          from app.ai_security import TamperDetector
          d = TamperDetector()
          f = d.extract_features(numpy.zeros((96, 96), dtype=numpy.uint8))
          assert len(f) == 13, f'expected 13 features, got {len(f)}'
          print('OK: opencv', cv2.__version__, '/ sklearn', sklearn.__version__, '/ detector loaded')
          "

      - name: Does not run as root
        run: |
          whoami=$(docker exec reveal-x-ci whoami)
          echo "container user: $whoami"
          [ "$whoami" != "root" ] || { echo "container runs as root"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs reveal-x-ci || true

      - name: Stop
        if: always()
        run: docker rm -f reveal-x-ci || true

  production-server:
    name: Production server boots and serves
    runs-on: ubuntu-latest
    # Gunicorn does not run on Windows, so this recipe cannot be verified on the
    # machine it was written on. Here it is booted for real and asked for a page
    # and a Socket.IO handshake, which is the difference between a deployment
    # command that is documented and one that is known to work.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies only
        # Deliberately not requirements-dev: production must stand up without
        # the test and ONNX-export toolchain. From the lock, so this boots
        # the same tree the image ships rather than a fresh resolution.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Boot the server exactly as the Procfile does
        run: |
          PORT=5000 sh -c "$(sed -n 's/^web: //p' Procfile)" &
          echo "GUNICORN_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/ 2>/dev/null; then
              echo "up after ${i} attempt(s)"
              exit 0
            fi
            sleep 0.5
          done
          echo "server never answered on port 5000"
          exit 1

      - name: Serves the application shell
        run: |
          body=$(curl -fsS http://127.0.0.1:5000/)
          echo "$body" | grep -q "Reveal-X" || { echo "page did not contain the app"; exit 1; }
          echo "OK: application shell served"

      - name: Completes a Socket.IO handshake
        # Long-polling is the transport that has to work for the chat to
        # function at all; a 200 on "/" would pass even with the socket dead.
        run: |
          handshake=$(curl -fsS "http://127.0.0.1:5000/socket.io/?EIO=4&transport=polling")
          echo "$handshake" | head -c 120
          echo
          echo "$handshake" | grep -q '"sid"' || { echo "no session id in handshake"; exit 1; }
          echo "OK: Socket.IO handshake completed"

      - name: Does not advertise Firebase when unconfigured
        # The endpoint must report null rather than half a config, or the sign-in
        # button appears and leads nowhere.
        run: |
          curl -fsS http://127.0.0.1:5000/api/auth/config | grep -q '"firebase":null' \
            || { echo "unconfigured server advertised Firebase"; exit 1; }
          echo "OK: reports firebase: null"

      - name: Stop the server
        if: always()
        run: kill "$GUNICORN_PID" 2>/dev/null || true
