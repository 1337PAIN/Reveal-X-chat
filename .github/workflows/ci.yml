name: CI

# Runs on every push and pull request. The suite existed long before this
# workflow did, which meant every run of it was someone remembering to type
# `pytest` -- and a broken pin in requirements.txt sat unnoticed because a fresh
# install from those exact files was never once exercised. That is the class of
# bug this is here to catch, so both jobs install from the pinned files rather
# than from a cache of whatever happened to work locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what the project is developed on. 3.12 is here so a
        # version-specific break shows up as one red cell rather than as a
        # mystery on somebody else's machine.
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install from the pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Show what actually got installed
        # When a transitive pin drifts, this is the first place to look.
        run: pip list

      - name: Run the suite
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered

  javascript:
    name: Browser tests
    runs-on: ubuntu-latest
    # The security-critical half of this project runs in the browser: E2EE key
    # agreement, the tamper detector, the service worker's request scoping. It
    # had no automated test at all until these.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        # Needed to regenerate the parity fixture from the server's own detector.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: The feature-parity fixture is current
        # The browser/server parity test compares against recorded server output.
        # If someone changes the Python extractor without regenerating, that test
        # keeps passing against stale numbers -- hiding exactly the drift it is
        # there to catch. So regenerate and require no diff.
        run: |
          python scripts/generate_feature_parity_fixture.py
          if ! git diff --exit-code -- tests/js/fixtures/feature-parity.json; then
            echo
            echo "The server's tamper features changed but the fixture was not regenerated."
            echo "Run: python scripts/generate_feature_parity_fixture.py"
            exit 1
          fi
          echo "OK: fixture matches the current server implementation"

      - name: Run the browser tests
        run: node --test "tests/js/*.test.mjs"

  production-server:
    name: Production server boots and serves
    runs-on: ubuntu-latest
    # Gunicorn does not run on Windows, so this recipe cannot be verified on the
    # machine it was written on. Here it is booted for real and asked for a page
    # and a Socket.IO handshake, which is the difference between a deployment
    # command that is documented and one that is known to work.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies only
        # Deliberately not requirements-dev: production must stand up without
        # the test and ONNX-export toolchain.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Boot the server exactly as the Procfile does
        run: |
          PORT=5000 sh -c "$(sed -n 's/^web: //p' Procfile)" &
          echo "GUNICORN_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/ 2>/dev/null; then
              echo "up after ${i} attempt(s)"
              exit 0
            fi
            sleep 0.5
          done
          echo "server never answered on port 5000"
          exit 1

      - name: Serves the application shell
        run: |
          body=$(curl -fsS http://127.0.0.1:5000/)
          echo "$body" | grep -q "Reveal-X" || { echo "page did not contain the app"; exit 1; }
          echo "OK: application shell served"

      - name: Completes a Socket.IO handshake
        # Long-polling is the transport that has to work for the chat to
        # function at all; a 200 on "/" would pass even with the socket dead.
        run: |
          handshake=$(curl -fsS "http://127.0.0.1:5000/socket.io/?EIO=4&transport=polling")
          echo "$handshake" | head -c 120
          echo
          echo "$handshake" | grep -q '"sid"' || { echo "no session id in handshake"; exit 1; }
          echo "OK: Socket.IO handshake completed"

      - name: Does not advertise Firebase when unconfigured
        # The endpoint must report null rather than half a config, or the sign-in
        # button appears and leads nowhere.
        run: |
          curl -fsS http://127.0.0.1:5000/api/auth/config | grep -q '"firebase":null' \
            || { echo "unconfigured server advertised Firebase"; exit 1; }
          echo "OK: reports firebase: null"

      - name: Stop the server
        if: always()
        run: kill "$GUNICORN_PID" 2>/dev/null || true
