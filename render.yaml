# One-click deploy blueprint for Render.
#
# Render is used here rather than Vercel for a structural reason: Flask-SocketIO
# keeps each client's session, room membership and pending packets in the worker
# process. Vercel's functions are request-scoped and stateless, so a handshake
# on one invocation and a poll on the next is an unknown session. This app needs
# a long-lived process, which is what a Render web service is.
#
# Deploy: push this repo to GitHub, then Render -> New -> Blueprint -> pick it.
# Everything below is created for you; nothing here contains a secret.

services:
  - type: web
    name: reveal-x
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/auth/config

    envVars:
      # Generated by Render and kept across deploys. Without it the app mints a
      # random key per boot and every session dies on restart.
      - key: REVEAL_X_SECRET_KEY
        generateValue: true

      # Render terminates TLS in front of the container and forwards
      # X-Forwarded-Proto, so both of these are safe and correct here.
      - key: REVEAL_X_COOKIE_SECURE
        value: "true"
      - key: REVEAL_X_FORCE_HTTPS
        value: "true"

      # Render *is* a reverse proxy, so without this every request looks like it
      # came from the proxy and one person failing a password would throttle
      # everybody. Only ever set this behind a proxy you control -- which, here,
      # is the case.
      - key: REVEALX_TRUST_PROXY
        value: "true"

      # The container filesystem is wiped on every deploy. On SQLite that means
      # every account disappears when you push -- a bad surprise mid-demo -- so
      # the database is a managed Postgres instead.
      - key: DATABASE_URL
        fromDatabase:
          name: reveal-x-db
          property: connectionString

      # Set these in the Render dashboard after the first deploy, then sign in
      # and change the password. Left unset here so no credential lives in git.
      - key: REVEALX_ADMIN_USER
        sync: false
      - key: REVEALX_ADMIN_PASSWORD
        sync: false

      # Google sign-in. All optional -- unset, the app serves the built-in
      # username/password login and hides the Google button. See
      # docs/FIREBASE_SETUP.md. FIREBASE_CREDENTIALS_JSON takes the
      # service-account JSON inline, since there is no filesystem to put it on.
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

databases:
  - name: reveal-x-db
    plan: free
    databaseName: revealx
    user: revealx
